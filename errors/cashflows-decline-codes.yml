source: https://developer.cashflows.com/api_reference/api_reference_overview.html
api: cashflows-remote-authentication-api
envelope:
  detail: >-
    The Remote Authentication API returns a pipe-delimited response string whose
    first field is a response code: one letter followed by a 3-digit number. The
    leading letter is the class; the trailing two digits are the specific code.
  example: "A|01S0135FD47|200|AUTHOK|Authorised|MCC6830070529"
classes:
  - letter: A
    meaning: Authorised
  - letter: V
    meaning: Validation error (e.g. invalid card number)
  - letter: D
    meaning: Declined
  - letter: R
    meaning: Referral (treated as declined)
  - letter: B
    meaning: Blocked
  - letter: C
    meaning: Cancelled
  - letter: S
    meaning: System error
