apis:
- aid: cashflows:cashflows-gateway-api
  name: Cashflows Gateway API
  description: REST API for creating and managing payment jobs and payments —
    create, retrieve, and cancel payment jobs; capture, refund, and cancel
    individual payments; card tokenisation; and recurring payments. Payment
    status changes are delivered asynchronously via webhook notifications
    (retried for up to a month) sent from Cashflows notification IPs.
  humanURL: https://developer.cashflows.com/api_reference/cashflows_gateway.html
  baseURL: https://gateway.cashflows.com/api/gateway
  tags:
  - Payments
  - Gateway
  - Webhook
  - Recurring Payments
  tags_raw:
  - Payments
  - Gateway
  - Webhooks
  - Recurring Payments
  properties:
  - type: Documentation
    url: https://developer.cashflows.com/gateway/cashflows_gateway.html
  - type: APIReference
    url: https://developer.cashflows.com/api_reference/cashflows_gateway.html
- aid: cashflows:cashflows-payments-api
  name: Cashflows Payments API
  description: REST/JSON API for cardholder-not-present card payments with
    3-D Secure support — authorisation, capture, void, refund, credit, IIN
    lookup, and 3-D Secure version 2 authentication and verification flows.
  humanURL: https://developer.cashflows.com/api_reference/payments.html
  tags:
  - Payments
  - 3D Secure
  - Card Payments
  tags_raw:
  - Payments
  - 3-D Secure
  - Card Payments
  properties:
  - type: Documentation
    url: https://developer.cashflows.com/onlinepayments
  - type: APIReference
    url: https://developer.cashflows.com/api_reference/payments.html
- aid: cashflows:cashflows-remote-authentication-api
  name: Cashflows Remote Authentication API
  description: API for connecting directly to the Cashflows acquiring network
    to authorise card transactions, authenticated with auth_id (Profile/Merchant
    ID) and auth_pass credential headers.
  humanURL: https://developer.cashflows.com/api_reference/remote_auth_api.html
  baseURL: https://secure.cashflows.com/gateway/remote_auth
  tags:
  - Payments
  - Acquiring
  - Authorization
  properties:
  - type: APIReference
    url: https://developer.cashflows.com/api_reference/remote_auth_api.html
- aid: cashflows:cashflows-in-person-payments-api
  name: Cashflows In-Person Payments API
  description: Standalone REST API for PCI-PTS secure Kinetic payment devices,
    served locally from the terminal (default http://127.0.0.1:8080) under
    /api/v2 — device info, ping/status, settings, transactions, screens,
    receipts, and printing.
  humanURL: https://developer.cashflows.com/api_reference/ipp.html
  baseURL: http://127.0.0.1:8080/api/v2
  tags:
  - Payments
  - In-Person Payments
  - Terminal
  properties:
