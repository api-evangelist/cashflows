name: Cashflows
kind: company
description: Cashflows is a United Kingdom payment gateway and card acquirer,
  headquartered in London and a principal member of Visa and Mastercard, that
  helps businesses accept, process, and manage card payments across online,
  in-app, and in-person channels. Its product family spans a REST Cashflows
  Gateway (payment jobs, captures, refunds, tokenisation, recurring payments,
  and webhooks), hosted and embedded checkout, a cardholder-not-present
  Payments API with 3-D Secure, a Remote Authentication API for connecting to
  the acquiring network, and an In-Person Payments API served locally from
  Kinetic PCI-PTS terminals. Cashflows ships a genuine self-serve developer
  portal at developer.cashflows.com with reference documentation, a dedicated
  integration/sandbox environment, and webhook-based payment notifications, but
  it does not publish a downloadable OpenAPI/Swagger definition or a public
  Postman collection; its API reference is hand-authored HTML. Authentication is
  header-based (ConfigurationId plus a SHA-512 request hash for the Gateway,
  and auth_id/auth_pass for Remote Authentication) rather than OAuth.
